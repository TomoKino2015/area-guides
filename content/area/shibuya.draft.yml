shopping_dining:
  en: "Shibuya offers world-class dining options ranging from Michelin-starred restaurants like L'Effervescence and Narisawa to casual eateries and high-tech conveyor belt sushi. The area is also home to numerous cafes, craft cocktail bars, and international supermarkets. Nonbei Yokocho provides an authentic Tokyo nightlife experience with its traditional bars."
  ja: "渋谷は、L'EffervescenceやNarisawaなどのミシュラン星付きレストランからカジュアルな飲食店、ハイテク回転寿司まで、世界クラスのダイニングオプションを提供しています。また、数多くのカフェ、クラフトカクテルバー、国際スーパーマーケットもあります。飲んべえ横丁は伝統的なバーで本格的な東京のナイトライフ体験を提供します。"

schools_healthcare:
  en: "Shibuya is home to several renowned educational institutions including the British School in Tokyo, Aoyama Gakuin University, and language schools like Shibuya Gaigo Gakuin. Healthcare services are well-catered with clinics like Hiroo International Clinic and hospitals such as Tokyo Metropolitan Hiroo Hospital providing excellent medical care."
  ja: "渋谷には、ブリティッシュスクール・イン・トーキョー、青山学院大学、渋谷外語学院などの言語学校など、いくつかの有名な教育機関があります。医療サービスは、広尾インターナショナルクリニックや東京都立広尾病院などの病院が優れた医療を提供しており、充実しています。"

parks:
  en: "For outdoor enthusiasts, parks such as Yoyogi Park, Miyashita Park, and Shoto Park provide green spaces to relax and enjoy nature. Yoyogi Park is particularly popular for its spacious grounds and proximity to Meiji Shrine."
  ja: "アウトドア愛好家には、代々木公園、宮下公園、松濤公園などの公園が、リラックスして自然を楽しむための緑地を提供しています。代々木公園は特に広々とした敷地と明治神宮への近さで人気です。"

