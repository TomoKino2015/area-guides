faq:
  - q:
      en: "Is Shibuya foreigner-friendly?"
      ja: "渋谷は外国人に優しいですか？"
    a:
      en: "Yes, Shibuya is very foreigner-friendly. Many buildings allow foreign tenants, and English support is available through various services. The area has a significant international population and numerous international schools and clinics."
      ja: "はい、渋谷は非常に外国人に優しいです。多くの建物が外国人入居者を許可しており、さまざまなサービスを通じて英語サポートが利用できます。このエリアには多くの国際人口と数多くのインターナショナルスクールやクリニックがあります。"
  - q:
      en: "What is the average rent range in Shibuya?"
      ja: "渋谷の平均賃料範囲は？"
    a:
      en: "Rent prices vary by neighborhood and property type. Studio apartments average around ¥130,600, 1LDK units around ¥228,800, and 2LDK units around ¥340,000. Prices can be higher in premium areas like Daikanyama and Omotesando."
      ja: "賃料はエリアと物件タイプによって異なります。スタジオアパートは平均約13万600円、1LDKは約22万8800円、2LDKは約34万円です。代官山や表参道などの高級エリアでは価格が高くなる場合があります。"
  - q:
      en: "How accessible is Shibuya by public transportation?"
      ja: "渋谷への公共交通機関でのアクセスは？"
    a:
      en: "Shibuya is extremely accessible, serving as a major transit hub. It's connected via JR Yamanote Line, Tokyo Metro lines (Hanzomon, Ginza, Fukutoshin), and Keio Inokashira Line. Major destinations like Shinjuku are just 5 minutes away by express train."
      ja: "渋谷は非常にアクセスが良く、主要な交通ハブとして機能しています。JR山手線、東京メトロ線（半蔵門、銀座、副都心）、京王井の頭線で接続されています。新宿などの主要目的地へは急行でわずか5分です。"

