      ja: "恵比寿ガーデンプレイス、グルメレストラン、ルーフトップバーを備えた高級エリア。美食家や洗練された都市生活を求める若いプロフェッショナルに最適。"
    highlights:
      - "Yebisu Garden Place"
      - "Gourmet dining"
      - "Rooftop bars"
  - name:
      en: "Sendagaya"
      ja: "千駄ヶ谷"
    description:
      en: "A unique blend of sports facilities, cultural landmarks, and residential tranquility. Known for its proximity to major sports venues and cultural sites."
      ja: "スポーツ施設、文化的ランドマーク、住宅の静けさが融合した独特なエリア。主要なスポーツ会場や文化施設への近さで知られる。"
    highlights:
      - "Sports facilities"
      - "Cultural landmarks"
      - "Residential tranquility"
  - name:
      en: "Omotesando"
      ja: "表参道"
    description:
      en: "Often called Tokyo's Champs-Élysées, featuring luxury boutiques, art galleries, and stunning architecture. A fashionable district attracting both locals and tourists."
      ja: "東京のシャンゼリゼとも呼ばれ、高級ブティック、アートギャラリー、美しい建築が特徴。地元の人々と観光客の両方を魅了するファッショナブルな地区。"
    highlights:
      - "Luxury shopping"
      - "Art galleries"
      - "Architectural landmarks"
  - name:
      en: "Yoyogi"
      ja: "代々木"
    description:
      en: "A peaceful neighborhood with Yoyogi Park and Meiji Shrine nearby. Offers a tranquil retreat from the bustling city center while maintaining excellent accessibility."
      ja: "代々木公園と明治神宮に近い静かなエリア。都心の喧騒から離れた静かな避難所を提供しながら、優れたアクセス性を維持。"
    highlights:
      - "Yoyogi Park"
      - "Meiji Shrine"
      - "Green spaces"

overview:
  en: "Shibuya is one of Tokyo's most iconic and dynamic districts, where modern urban life meets cultural innovation. Known globally for its high-energy atmosphere, Shibuya serves as the heartbeat of fashion, entertainment, dining, and art. The area offers a lifestyle that is as diverse as it is exciting, making it a prime location to live, work, and thrive."
  ja: "渋谷は東京で最も象徴的でダイナミックな地区の一つで、現代的な都市生活と文化的イノベーションが交差する場所です。世界的に知られる高エネルギーな雰囲気で、ファッション、エンターテイメント、ダイニング、アートの中心地として機能しています。多様で刺激的なライフスタイルを提供し、住み、働き、繁栄するための理想的な場所です。"

