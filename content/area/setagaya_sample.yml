# FAQ（G7）
faq:
  - q:
      ja: "世田谷区は外国人に優しいですか？"
      en: "Is Setagaya foreigner-friendly?"
    a:
      ja: "はい、世田谷区は外国人居住者に優しい環境が整っています。英語対応の医療機関、インターナショナルスクール、外国人向け物件紹介サービスなどが充実しています。"
      en: "Yes, Setagaya offers a welcoming environment for foreign residents with English-speaking medical facilities, international schools, and property introduction services for foreigners."
  - q:
      ja: "世田谷区の平均賃料はどのくらいですか？"
      en: "What is the average rent in Setagaya?"
    a:
      ja: "間取りによって異なりますが、2025年Q1時点では、1Rが約10.05万円、1LDKが約18.40万円、2LDKが約25.53万円となっています。サブエリアによっても変動があります。"
      en: "Rent varies by floor plan. As of Q1 2025, average rents are approximately ¥100,500 for 1R, ¥184,000 for 1LDK, and ¥255,300 for 2LDK. Prices also vary by subarea."
  - q:
      ja: "世田谷区へのアクセスはどうですか？"
      en: "How accessible is Setagaya?"
    a:
      ja: "都心へのアクセスが良好です。三軒茶屋から渋谷まで約10分、新宿まで約25分です。田園都市線、小田急線、東急世田谷線など複数の路線が通っており、利便性が高いです。"
      en: "Setagaya offers excellent access to central Tokyo. From Sangenjaya, it's about 10 minutes to Shibuya and 25 minutes to Shinjuku. Multiple train lines including Den-en-toshi Line, Odakyu Line, and Tokyu Setagaya Line provide convenient transportation."

