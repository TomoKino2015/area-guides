    name:
      ja: "三軒茶屋"                 # G3-③ 固有名詞
      en: "Sangenjaya"
    description:
      ja: "田園都市線と世田谷線が交わる若者文化の拠点。飲食店が豊富で、夜も賑やかなエリアです。渋谷まで10分、新宿まで25分の好立地。"  # G3-②
      en: "A lively hub where Den-en-toshi and Setagaya lines meet. Rich in dining options, vibrant even at night. Just 10 minutes to Shibuya, 25 minutes to Shinjuku."
    highlights:
      - "交通至便"
      - "飲食店が豊富"
      - "若者文化の中心"
    cons:
      - "駅周辺が賑やかで家賃高め"
