hero:
  tagline:
    ja: "緑とカフェと子育ての街。都心すぎず郊外すぎないちょうどいい生活圏。" # G1-②
    en: "Green, family-friendly, relaxed — close to central Tokyo without the chaos."           # G1-②
  lead:
    ja: |
      東京23区の南西部に位置する世田谷区。都会の利便性と郊外の静けさが理想的に融合したエリアです。
      特に三軒茶屋、下北沢、二子玉川、成城学園前の4大エリアは、それぞれ異なる魅力を持ち、
      若手ビジネスパーソンからクリエイター、外国人居住者まで、多様な人々を惹きつけています。  # G1-② 既存テキストを要約
    en: |
      Setagaya sits on the west side of Tokyo's 23 wards, offering an ideal fusion of urban convenience and suburban serenity.
      Four major areas—Sangenjaya, Shimokitazawa, Futako-Tamagawa, and Seijo-Gakuen-mae—each have their own unique charm,
      attracting diverse residents from young professionals to creatives and international residents.  # G1-②

