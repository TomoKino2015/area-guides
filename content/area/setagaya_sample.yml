        ja: "三軒茶屋の街並み（サンプル）"                # G3-②
        en: "Sangenjaya streets (sample)"                 # G3-②
  - id: "shimokitazawa"
    name:
      ja: "下北沢"
      en: "Shimokitazawa"
    description:
      ja: "個性的な店が並ぶサブカルチャーの発信地。古着屋、ライブハウス、カフェが集まり、クリエイティブな雰囲気が魅力です。"
      en: "A hub of subculture with unique shops. Vintage clothing stores, live music venues, and cafes create a creative atmosphere."
    highlights:
      - "サブカルチャーの中心"
