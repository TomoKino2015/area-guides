hero:
  tagline:
    ja: "都心へのアクセスが良く、自然と文化が調和する住みやすい街。" # G1-②
    en: "Easy access to central Tokyo, where nature and culture harmonize in a livable neighborhood." # G1-②
  lead:
    ja: |
      東京23区の西側に位置する杉並区は、JR中央線や東京メトロ丸ノ内線など複数の路線が走り、
      新宿・渋谷・東京・品川へのアクセスが良好です。荻窪や高円寺などの主要駅を中心に、
      ファミリー層から若手ビジネスパーソンまで、多様な人々が暮らす住みやすいエリアです。  # G1-②
    en: |
      Located on the west side of Tokyo's 23 wards, Suginami offers excellent access to Shinjuku, Shibuya, Tokyo, and Shinagawa
      via multiple train lines including JR Chuo Line and Tokyo Metro Marunouchi Line. Centered around major stations like Ogikubo and Koenji,
      it's a livable area attracting diverse residents from families to young professionals.  # G1-②

