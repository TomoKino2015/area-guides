who_it_fits:
  tags:                              # G2-①
    - "ファミリー"
    - "共働きカップル"
    - "都心勤務だけど静かな環境が好き"
    - "自然豊かな環境"
    - "交通利便性重視"
  description:
    ja: |                            # G2-②
      杉並区は、都心へのアクセスが良く、緑豊かな環境と子育てしやすい街として人気があります。
      特にファミリー層や共働きカップルに適しており、静かで落ち着いた住宅街が広がっています。
      高円寺や荻窪などの主要駅周辺には商店街や商業施設が充実し、日常生活も便利です。
    en: |
      Suginami is popular for its excellent access to central Tokyo, green environment, and family-friendly atmosphere.
      It's particularly suitable for families and dual-income couples, with quiet residential areas spreading throughout the ward.
      Major stations like Koenji and Ogikubo offer well-equipped shopping streets and commercial facilities for daily convenience.
  sample_residents:                  # G2-①/② 簡易サンプル（1〜2件）
    - name: "Sample Resident"
      profile_ja: "荻窪在住・30代・会社員"
      profile_en: "Lives in Ogikubo, 30s, office worker"
      quote_ja: "新宿まで11分で、通勤が楽です。緑も多くて、週末は散歩を楽しんでいます。"
      quote_en: "It's convenient for commuting, just 11 minutes to Shinjuku. There's plenty of greenery, and I enjoy walking on weekends."

