# FAQ（G7）
faq:
  - q:
      ja: "杉並区は外国人に優しいですか？"
      en: "Is Suginami foreigner-friendly?"
    a:
      ja: "徐々に外国人居住者向けのサポートが充実してきています。英語対応の医療機関や、国際的な雰囲気のあるエリア（高円寺・荻窪など）があります。"
      en: "Support for foreign residents is gradually improving. There are English-speaking medical facilities and areas with an international atmosphere (Koenji, Ogikubo, etc.)."
  - q:
      ja: "杉並区の平均賃料はどのくらいですか？"
      en: "What is the average rent in Suginami?"
    a:
      ja: "間取りによって異なりますが、2025年Q1時点では、1Rが約8.14万円、1LDKが約16.97万円、2LDKが約23.26万円となっています。"
      en: "Rent varies by floor plan. As of Q1 2025, average rents are approximately ¥81,400 for 1R, ¥169,700 for 1LDK, and ¥232,600 for 2LDK."
  - q:
      ja: "杉並区へのアクセスはどうですか？"
      en: "How accessible is Suginami?"
    a:
      ja: "都心へのアクセスが良好です。高円寺から新宿まで約6分、荻窪から新宿まで約11分です。JR中央線、東京メトロ丸ノ内線など複数の路線が通っており、利便性が高いです。"
      en: "Suginami offers excellent access to central Tokyo. From Koenji, it's about 6 minutes to Shinjuku, and from Ogikubo, about 11 minutes. Multiple train lines including JR Chuo Line and Tokyo Metro Marunouchi Line provide convenient transportation."

